name: New SBC alerts

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode"
        type: boolean
        default: false
      test_url:
        description: "Test URL"
        type: string
        default: ""

permissions:
  contents: write          # needed to save posted.json back to the repo

concurrency:
  group: sbc-alerts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ inputs.test && '1' || '' }}
          TEST_URL: ${{ inputs.test_url }}

      - name: Save posted list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json || true
          git diff --staged --quiet || (git commit -m "Update posted SBCs" && git push)
